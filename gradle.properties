# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure for Android Support Library
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP (Room codegen) registers its generated sources via the Kotlin sourceSets
# DSL, which AGP 9's built-in Kotlin disallows by default. Required for Room + KSP.
android.disallowKotlinSourceSets=false
